name: Gym Availability Checker

on:
  schedule: # (skip JST 01:00-05:59) other every 40 min
    - cron: "0,40 21-23 * * *" # 21:00-23:59 UTC (06:00-08:59 JST)
    - cron: "0,40 0-15 * * *" # 0:00-15:59 UTC (09:00-00:59 JST)
  workflow_dispatch: # Allow manual triggering

jobs:
  check-availability:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Create .env file
        run: |
          echo "BOT_POTTER_LINE_CHANNEL_ACCESS_TOKEN=${{ secrets.BOT_POTTER_LINE_CHANNEL_ACCESS_TOKEN }}" > .env
          echo "BOT_POTTER_LINE_GROUP_ID=${{ secrets.BOT_POTTER_LINE_GROUP_ID }}" >> .env
          echo "BOT_POKOBI_LINE_CHANNEL_ACCESS_TOKEN=${{ secrets.BOT_POKOBI_LINE_CHANNEL_ACCESS_TOKEN }}" >> .env
          echo "BOT_POKOBI_LINE_GROUP_ID=${{ secrets.BOT_POKOBI_LINE_GROUP_ID }}" >> .env
          echo "PASSWORD=${{ secrets.PASSWORD }}" >> .env
          echo "USER_ID=${{ secrets.USER_ID }}" >> .env
          echo "TAI_USER_ID=${{ secrets.TAI_USER_ID }}" >> .env
          echo "TAI_PASSWORD=${{ secrets.TAI_PASSWORD }}" >> .env
          echo "SHIBUYA_ID=${{ secrets.SHIBUYA_ID }}" >> .env
          echo "SHIBUYA_PASSWORD=${{ secrets.SHIBUYA_PASSWORD }}" >> .env
          echo "MINATO_ID=${{ secrets.MINATO_ID }}" >> .env
          echo "MINATO_PASSWORD=${{ secrets.MINATO_PASSWORD }}" >> .env

      - name: Run availability check
        run: pnpm test

      # 不上傳 artifacts。
      #
      # 這個 repo 是公開的，而公開 repo 的 workflow artifacts 任何人都能下載。
      # playwright.config.ts 設了 trace: "on" / screenshot: "on"，港區那支又會用
      # 真實帳號登入（MINATO_ID / MINATO_PASSWORD），trace 會記錄操作過程與 DOM 快照，
      # 等於把登入過程公開出去。
      #
      # 要重新打開的話，先確認至少一項：repo 改成 private、或關掉 trace/screenshot、
      # 或只上傳不含 trace 的純文字 log。
